    # 2 x Storage Servers in Frontend Network
    storage-svr-01:
      kind: linux
      mgmt-ipv4: 192.168.100.51
      binds:
        - server-base-configs/hostname.sh:/hostname.sh
        - server-base-configs/daemons:/etc/frr/daemons
        - server-base-configs:/config
        - server-base-configs/storage-svr-01-frr.conf:/etc/frr/frr.conf
      exec:
        - bash /config/storage-svr-01.sh
    
    storage-svr-02:
      kind: linux
      mgmt-ipv4: 192.168.100.52
      binds:
        - server-base-configs/hostname.sh:/hostname.sh
        - server-base-configs/daemons:/etc/frr/daemons
        - server-base-configs:/config
        - server-base-configs/storage-svr-02-frr.conf:/etc/frr/frr.conf
      exec:
        - bash /config/storage-svr-02.sh

    # 1x PXE Boot Server in Frontend Network
    pxe-svr-01:
      kind: linux
      mgmt-ipv4: 192.168.100.53
      binds:
        - server-base-configs/hostname.sh:/hostname.sh
        - server-base-configs/daemons:/etc/frr/daemons
        - server-base-configs:/config
      exec:
        - bash /config/pxe-svr-01.sh

    # 1 x Internet server
    internet-svr-01:
      kind: linux
      mgmt-ipv4: 192.168.100.61
      binds:
        - server-base-configs/hostname.sh:/hostname.sh
        - server-base-configs/daemons:/etc/frr/daemons
