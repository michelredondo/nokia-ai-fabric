name: ai-fabric
prefix: ""

mgmt:
  network: mgmt-net
  ipv4-subnet: 192.168.100.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:26.7.1
    linux:
      image: quay.io/frrouting/frr:10.1.3
      type: linux

  nodes:
    # 3xIXR H5 switches are members of AI Backend Fabric
    bespine-01:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.10
      type: ixr-h5-64o

    beleaf-01:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.11
      type: ixr-h5-64o

    beleaf-02:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.12
      type: ixr-h5-64o

    ## 6xH5 Leaf + 2xD5 Border Leaf + 2xH5 Spines switches are members of FE Fabric

    # Compute Leaf
    feleaf-01:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.21
      type: ixr-h5-32d
      #type: ixr-d5
      startup-config: ./configs/feleaf-01.cfg
    feleaf-02:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.22
      type: ixr-h5-32d
      #type: ixr-d5
      startup-config: ./configs/feleaf-02.cfg
    feleaf-03:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.23
      type: ixr-h5-32d
      #type: ixr-d5
      startup-config: ./configs/feleaf-03.cfg
    feleaf-04:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.24
      type: ixr-h5-32d
      #type: ixr-d5
      startup-config: ./configs/feleaf-04.cfg
    feleaf-05:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.25
      type: ixr-h5-32d
      #type: ixr-d5
      startup-config: ./configs/feleaf-05.cfg
    feleaf-06:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.26
      type: ixr-h5-32d
      #type: ixr-d5
      startup-config: ./configs/feleaf-06.cfg
    # Border  
    febleaf-07:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.27
      type: ixr-d5
      startup-config: ./configs/febleaf-07.cfg
    febleaf-08:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.28
      type: ixr-d5
      startup-config: ./configs/febleaf-08.cfg
    # Spine
    fespine-01:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.31
      type: ixr-h5-64o
      startup-config: ./configs/fespine-01.cfg
    fespine-02:
      kind: nokia_srlinux
      mgmt-ipv4: 192.168.100.32
      type: ixr-h5-64o
      startup-config: ./configs/fespine-02.cfg

    # 6 x GPU Servers 
    gpu-svr-01:
      kind: linux
      mgmt-ipv4: 192.168.100.41
      binds:
        - server-base-configs/hostname.sh:/hostname.sh
        - server-base-configs/daemons:/etc/frr/daemons
        - server-base-configs:/config
        - server-base-configs/gpu-svr-01-frr.conf:/etc/frr/frr.conf
      exec:
        - bash /config/gpu-svr-01.sh

    gpu-svr-02:
      kind: linux
      mgmt-ipv4: 192.168.100.42
      binds:
        - server-base-configs/hostname.sh:/hostname.sh
        - server-base-configs/daemons:/etc/frr/daemons
        - server-base-configs:/config
        - server-base-configs/gpu-svr-02-frr.conf:/etc/frr/frr.conf
      exec:
        - bash /config/gpu-svr-02.sh

    gpu-svr-03:
      kind: linux
      mgmt-ipv4: 192.168.100.43
      binds:
        - server-base-configs/hostname.sh:/hostname.sh
        - server-base-configs/daemons:/etc/frr/daemons
        - server-base-configs:/config
        - server-base-configs/gpu-svr-03-frr.conf:/etc/frr/frr.conf
      exec:
        - bash /config/gpu-svr-03.sh

    gpu-svr-04:
