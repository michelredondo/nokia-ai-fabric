# Explicitly reject subnet pools
# import only IFL /32 routes from leaf switches to avoid ARP storms triggered by Internet scans.
set / routing-policy policy BORDERLEAF-IMPORT default-action policy-result accept
set / routing-policy policy BORDERLEAF-IMPORT statement 10  match prefix prefix-set internet-client-subnet-pools
set / routing-policy policy BORDERLEAF-IMPORT statement 10 action policy-result reject
set / routing-policy policy BORDERLEAF-IMPORT statement 20 match bgp extended-community extended-community-set INTERNET
set / routing-policy policy BORDERLEAF-IMPORT statement 20 match bgp extended-community match-set-options any
set / routing-policy policy BORDERLEAF-IMPORT statement 20 action policy-result accept

set / network-instance IPVRF-INTERNET protocols bgp-vpn bgp-instance 1 export-policy [ BORDERLEAF-EXPORT ]
set / network-instance IPVRF-INTERNET protocols bgp-vpn bgp-instance 1 import-policy [ BORDERLEAF-IMPORT ]