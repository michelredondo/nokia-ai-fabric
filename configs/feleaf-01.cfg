# SERVICE PXE-BOOT
set / interface lag1 subinterface 0 type bridged
set / interface lag1 subinterface 0 vlan encap untagged
set / interface lag2 subinterface 0 type bridged
set / interface lag2 subinterface 0 vlan encap untagged

set / interface lag1 lag lacp-fallback-mode static
set / interface lag2 lag lacp-fallback-mode static

set / network-instance PXE-BOOT type mac-vrf
set / network-instance PXE-BOOT admin-state enable
set / network-instance PXE-BOOT interface lag1.0
set / network-instance PXE-BOOT interface lag2.0
set / network-instance PXE-BOOT vxlan-interface vxlan1.65535
set / network-instance PXE-BOOT protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan1.65535
set / network-instance PXE-BOOT protocols bgp-evpn bgp-instance 1 evi 65535
set / network-instance PXE-BOOT protocols bgp-evpn bgp-instance 1 ecmp 1
set / network-instance PXE-BOOT protocols bgp-evpn bgp-instance 1 routes bridge-table mac-ip advertise true
set / network-instance PXE-BOOT protocols bgp-evpn bgp-instance 1 routes bridge-table inclusive-mcast advertise true
set / network-instance PXE-BOOT protocols bgp-vpn bgp-instance 1 route-target export-rt target:65555:65535
set / network-instance PXE-BOOT protocols bgp-vpn bgp-instance 1 route-target import-rt target:65555:65535
set / network-instance PXE-BOOT bridge-table mac-learning admin-state enable
set / network-instance PXE-BOOT bridge-table mac-learning aging admin-state enable
set / network-instance PXE-BOOT bridge-table mac-learning aging age-time 300
set / network-instance PXE-BOOT bridge-table mac-duplication admin-state enable
set / network-instance PXE-BOOT bridge-table mac-duplication action blackhole

set / tunnel-interface vxlan1 vxlan-interface 65535 type bridged
set / tunnel-interface vxlan1 vxlan-interface 65535 ingress vni 65535