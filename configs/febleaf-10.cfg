set / interface ethernet-1/1 subinterface 10 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 10 ipv4 address 10.0.3.0/31 primary
set / interface ethernet-1/1 subinterface 10 vlan encap single-tagged vlan-id 10
set / interface ethernet-1/1 subinterface 10 ipv4 arp learn-unsolicited true
set / interface ethernet-1/1 subinterface 10 ipv4 arp host-route populate static
set / interface ethernet-1/1 subinterface 10 ipv4 arp host-route populate dynamic

set / interface ethernet-1/1 subinterface 20 type routed
set / interface ethernet-1/1 subinterface 20 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 20 ipv4 address 192.168.3.0/31 primary
set / interface ethernet-1/1 subinterface 20 vlan encap single-tagged vlan-id 20
set / interface ethernet-1/1 subinterface 20 ipv4 arp learn-unsolicited true
set / interface ethernet-1/1 subinterface 20 ipv4 arp host-route populate static
set / interface ethernet-1/1 subinterface 20 ipv4 arp host-route populate dynamic

set / network-instance IPVRF-TENANT-A interface ethernet-1/1.10
set / network-instance IPVRF-TENANT-A interface ethernet-1/1.20

set / network-instance IPVRF-TENANT-A type ip-vrf
set / network-instance IPVRF-TENANT-A admin-state enable
set / network-instance IPVRF-TENANT-A vxlan-interface vxlan1.101
set / network-instance IPVRF-TENANT-A protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan1.101
set / network-instance IPVRF-TENANT-A protocols bgp-evpn bgp-instance 1 evi 101
set / network-instance IPVRF-TENANT-A protocols bgp-evpn bgp-instance 1 ecmp 8
set / network-instance IPVRF-TENANT-A protocols bgp-vpn bgp-instance 1 route-target export-rt target:65555:101
set / network-instance IPVRF-TENANT-A protocols bgp-vpn bgp-instance 1 route-target import-rt target:65555:101
set / network-instance IPVRF-TENANT-A ip-forwarding receive-ipv4-check false

set / tunnel-interface vxlan1 vxlan-interface 101 type routed
set / tunnel-interface vxlan1 vxlan-interface 101 ingress vni 101

# Applied to Tenant VRF import/export to prevent leaked routes from being re-announced in EVPN
set / routing-policy extended-community-set TENANT-A member [ target:65555:101 ]

set / routing-policy policy TENANT-A-EXPORT default-action policy-result accept
set / routing-policy policy TENANT-A-EXPORT default-action bgp extended-community operation add
set / routing-policy policy TENANT-A-EXPORT default-action bgp extended-community referenced-sets [ TENANT-A ]
set / routing-policy policy TENANT-A-EXPORT statement 10 match network-instance-leaked-route true
set / routing-policy policy TENANT-A-EXPORT statement 10 action policy-result reject

set / routing-policy policy TENANT-A-IMPORT default-action policy-result accept
set / routing-policy policy TENANT-A-IMPORT statement 10 match bgp extended-community extended-community-set TENANT-A
set / routing-policy policy TENANT-A-IMPORT statement 10 match bgp extended-community match-set-options any
set / routing-policy policy TENANT-A-IMPORT statement 10 action policy-result accept

set / network-instance IPVRF-TENANT-A protocols bgp-vpn bgp-instance 1 export-policy [ TENANT-A-EXPORT ]
set / network-instance IPVRF-TENANT-A protocols bgp-vpn bgp-instance 1 import-policy [ TENANT-A-IMPORT ]

# MH ARP SYNC (IPVRF-TENANT-A)
set / network-instance IPVRF-TENANT-A protocols layer-3-evpn-neighbor-synchronization admin-state enable
set / network-instance IPVRF-TENANT-A protocols layer-3-evpn-neighbor-synchronization route-distinguisher 10.0.0.20:6002
set / network-instance IPVRF-TENANT-A protocols layer-3-evpn-neighbor-synchronization evi-route-target evi-target:65555:6002
set / network-instance IPVRF-TENANT-A protocols layer-3-evpn-neighbor-synchronization retention-timer 300

## SERVICE IPVRF-STORAGE (Central STORAGE service)

set / network-instance IPVRF-STORAGE type ip-vrf
set / network-instance IPVRF-STORAGE admin-state enable
set / network-instance IPVRF-STORAGE vxlan-interface vxlan64.1001
set / network-instance IPVRF-STORAGE protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan64.1001
set / network-instance IPVRF-STORAGE protocols bgp-evpn bgp-instance 1 evi 1001
set / network-instance IPVRF-STORAGE protocols bgp-evpn bgp-instance 1 ecmp 8
set / network-instance IPVRF-STORAGE protocols bgp-vpn bgp-instance 1 route-target export-rt target:65555:1001
set / network-instance IPVRF-STORAGE protocols bgp-vpn bgp-instance 1 route-target import-rt target:65555:1001
set / network-instance IPVRF-STORAGE ip-forwarding receive-ipv4-check false

set / tunnel-interface vxlan64 vxlan-interface 1001 type routed
set / tunnel-interface vxlan64 vxlan-interface 1001 ingress vni 1001


## STORAGE Leaking

set / routing-policy prefix-set central-storage prefix 192.168.255.0/24 mask-length-range 24..32

set / routing-policy prefix-set tenant-a-storage prefix 192.168.1.0/24 mask-length-range 24..32
set / routing-policy prefix-set tenant-a-storage prefix 192.168.3.0/24 mask-length-range 24..32

set / routing-policy prefix-set tenant-b-storage prefix 192.168.2.0/24 mask-length-range 24..32

set / routing-policy policy export-tenant-a default-action policy-result reject
set / routing-policy policy export-tenant-a statement 1 
set / routing-policy policy export-tenant-a statement 1 match prefix prefix-set tenant-a-storage
set / routing-policy policy export-tenant-a statement 1 action policy-result accept

set / routing-policy policy export-tenant-b default-action policy-result reject
set / routing-policy policy export-tenant-b statement 1 
set / routing-policy policy export-tenant-b statement 1 match prefix prefix-set tenant-b-storage
set / routing-policy policy export-tenant-b statement 1 action policy-result accept

set / routing-policy policy import-central-storage default-action policy-result reject
set / routing-policy policy import-central-storage statement 1 
set / routing-policy policy import-central-storage statement 1 match prefix prefix-set central-storage
set / routing-policy policy import-central-storage statement 1 action policy-result accept

set / routing-policy policy export-central-storage default-action policy-result reject
set / routing-policy policy export-central-storage statement 1 
set / routing-policy policy export-central-storage statement 1 match prefix prefix-set central-storage
set / routing-policy policy export-central-storage statement 1 action policy-result accept

set / routing-policy policy import-tenant-storage-subnets default-action policy-result reject
set / routing-policy policy import-tenant-storage-subnets statement 1 
set / routing-policy policy import-tenant-storage-subnets statement 1 match prefix prefix-set tenant-a-storage
set / routing-policy policy import-tenant-storage-subnets statement 1 action policy-result accept
set / routing-policy policy import-tenant-storage-subnets statement 2 
set / routing-policy policy import-tenant-storage-subnets statement 2 match prefix prefix-set tenant-b-storage
set / routing-policy policy import-tenant-storage-subnets statement 2 action policy-result accept

set / network-instance IPVRF-TENANT-A inter-instance-policies apply-policy import-policy [ import-central-storage ]
set / network-instance IPVRF-TENANT-A inter-instance-policies apply-policy export-policy [ export-tenant-a ]

set / network-instance IPVRF-STORAGE inter-instance-policies apply-policy import-policy [ import-tenant-storage-subnets ]
set / network-instance IPVRF-STORAGE inter-instance-policies apply-policy export-policy [ export-central-storage ]

# required to leak /32 from hosts
set / interface ethernet-1/1 subinterface 10 ipv4 arp host-route populate dynamic datapath-programming true
set / interface ethernet-1/1 subinterface 20 ipv4 arp host-route populate dynamic datapath-programming true
set / interface ethernet-1/1 subinterface 30 ipv4 arp host-route populate dynamic datapath-programming true