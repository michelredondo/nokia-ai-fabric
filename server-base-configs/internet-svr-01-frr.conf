!
ip prefix-list ONLY-LOOPBACK permit 172.16.255.255/32
ip prefix-list internet-client-hosts seq 5 permit 172.16.1.0/24 ge 32 le 32
ip prefix-list internet-client-hosts seq 10 permit 172.16.2.0/24 ge 32 le 32
ip prefix-list internet-client-hosts seq 10 permit 172.16.3.0/24 ge 32 le 32

!
ip route 172.16.1.0/24 172.16.255.0
ip route 172.16.1.0/24 172.16.255.2
ip route 172.16.2.0/24 172.16.255.0
ip route 172.16.2.0/24 172.16.255.2
!
route-map RM-OUT permit 10
 match ip address prefix-list ONLY-LOOPBACK
exit
!
route-map RM-IN permit 10
 match ip address prefix-list internet-client-hosts
exit
!
router bgp 65501
 bgp router-id 172.16.255.255
 no bgp default ipv4-unicast
 !
 neighbor 172.16.255.0 remote-as 64255
 neighbor 172.16.255.2 remote-as 64255
 !
 address-family ipv4 unicast
  network 172.16.255.255/32
  neighbor 172.16.255.0 activate
  neighbor 172.16.255.0 default-originate
  neighbor 172.16.255.0 route-map RM-IN in
  neighbor 172.16.255.0 route-map RM-OUT out
  neighbor 172.16.255.2 activate
  neighbor 172.16.255.2 default-originate
  neighbor 172.16.255.2 route-map RM-IN in
  neighbor 172.16.255.2 route-map RM-OUT out
 exit-address-family
exit
!
end
